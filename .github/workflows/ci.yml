name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install flake8 pytest

      - name: Install package deps
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 insighta/ --max-line-length=120 --ignore=E501,W503

      - name: Test
        run: pytest tests/ -v
